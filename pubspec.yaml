name: storza
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  video_player: ^2.8.1
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  http: ^1.2.0
  dio: ^5.4.1
  get_storage: ^2.1.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/Assets/Logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/Assets/
